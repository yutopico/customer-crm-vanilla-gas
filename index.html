<!DOCTYPE html>
<html lang="ja">
    <head><!-- ページのタイトルや文字コードなど、画面に直接表示されない設定を書く場所 -->
        <!-- 日本語などを文字化けせず表示するため、文字コードをUTF-8に設定 -->
        <meta charset="UTF-8">
        <!-- スマートフォンでも画面幅に合わせて表示するための設定 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- ブラウザのタブに表示されるページタイトル -->
        <title>顧客管理Webアプリ</title>

        <!-- 画面の見た目を管理するCSSファイルを読み込む -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body><!-- ここから、ユーザーの画面に実際に表示される内容を書く -->
        <!-- アプリ画面の主要な内容をまとめる領域 -->
        <main class="app-container">

            <!-- アプリ名や説明をまとめるヘッダー領域 -->
            <header class="top-header">
                <!-- ロゴ・アプリ名・キャッチコピーをまとめる領域 -->
                <div class="brand">
                    <!-- 装飾用のロゴ。内容を持たないため読み上げ対象から外す -->
                    <div class="brand-logo" aria-hidden="true"></div>

                    <!-- アプリ名とキャッチコピー -->
                    <div class="brand-text">
                        <h1>顧客管理</h1>
                        <p>顧客情報を、もっとスマートに。</p>
                    </div>
                </div>

                <!-- お知らせとメニューの操作ボタン -->
                <div class="header-actions">
                    <!-- type="button"で通常の操作ボタンとして扱う -->
                    <button class="icon-button" type="button" aria-label="お知らせ">
                        <span aria-hidden="true">🔔</span>
                        <span class="action-label">お知らせ</span>
                    </button>

                    <button class="icon-button" type="button" aria-label="メニュー">
                        <span aria-hidden="true">☰</span>
                        <span class="action-label">メニュー</span>
                    </button>
                </div>
            </header>

            <!-- ホーム画面上部の挨拶とAIサマリーをまとめる領域 -->
            <section class="home-overview">
                <!-- 利用者への挨拶を表示する領域 -->
                <div class="welcome-message">
                    <h2>おかえりなさい！</h2>
                    <p>今日も素敵な一日になりますように。</p>
                </div>

                <!-- AIが顧客情報を分析した結果を表示するカード -->
                <section class="ai-summary-card">
                    <!-- AIサマリーカードの見出し -->
                    <div class="ai-summary-header">
                        <h2>AIサマリー</h2>
                        <span class="new-label">NEW</span>
                    </div>

                    <!-- 現在は画面確認用の仮データ -->
                    <ul class="ai-summary-list">
                        <li>今月お誕生日のお客様が9名います。</li>
                        <li>今月の新規登録は12名です。</li>
                        <li>最近30日間来店がない常連が5名います。</li>
                    </ul>
                </section>
            </section>

            <!-- ホーム画面の主要機能へ移動するメニュー -->
            <section class="quick-actions">

                <!-- 主要機能のカードを並べる領域 -->
                <div class="action-grid">

                    <!-- 新しい顧客を登録するメニュー -->
                    <button class="action-card action-card--new" type="button">
                        <!-- 人物とプラス記号を組み合わせた新規登録アイコン -->
                        <span class="action-card-icon" aria-hidden="true">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                            
                                <!-- 人物の頭 -->
                                <circle cx="9" cy="7" r="4"></circle>

                                <!-- 人物の肩から身体の部分 -->
                                <path d="M3 21v-2a6 6 0 0 1 6-6h2"></path>

                                <!-- 新規追加を表すプラス記号 -->
                                <path d="M19 14v6"></path>
                                <path d="M16 17h6"></path>
                            </svg>
                        </span>
                        <span class="action-card-title">新規顧客登録</span>
                        <span class="action-card-description">新しく登録する</span>
                    </button>

                    <!-- 常連顧客の情報を更新するメニュー -->
                    <button class="action-card action-card--regular" type="button">
                        <!-- 人物と鉛筆を組み合わせた顧客情報更新アイコン -->
                        <span class="action-card-icon" aria-hidden="true">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <!-- 人物の頭 -->
                                <circle cx="8" cy="7" r="4"></circle>

                                <!-- 人物の肩から身体の部分 -->
                                <path d="M2 21v-2a6 6 0 0 1 6-6h3"></path>

                                <!-- 顧客情報の編集を表す鉛筆 -->
                                <path d="M14 20l1-4 5-5 3 3-5 5-4 1z"></path>

                                <!-- 鉛筆の先端側を表す線 -->
                                <path d="M18 12l3 3"></path>
                            </svg>
                        </span>
                        <span class="action-card-title">常連顧客更新</span>
                        <span class="action-card-description">情報を更新する</span>
                    </button>

                    <!-- 登録済みの顧客を探すメニュー -->
                    <button class="action-card action-card--search" type="button">
                        <!-- 人物と虫眼鏡を組み合わせた顧客検索アイコン -->
                        <span class="action-card-icon" aria-hidden="true">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <!-- 人物の頭 -->
                                <circle cx="8" cy="7" r="4"></circle>

                                <!-- 人物の肩から身体の部分 -->
                                <path d="M2 21v-2a6 6 0 0 1 6-6h2"></path>

                                <!-- 顧客を探すことを表す虫眼鏡 -->
                                <circle cx="17" cy="16" r="4"></circle>

                                <!-- 虫眼鏡の持ち手 -->
                                <path d="M20 19l3 3"></path>
                            </svg>
                        </span>
                        <span class="action-card-title">顧客検索</span>
                        <span class="action-card-description">お客様を検索する</span>
                    </button>

                    <!-- 顧客や来店状況を確認するメニュー -->
                    <button class="action-card action-card--summary" type="button">
                        <!-- データの集計を表す棒グラフアイコン -->
                        <span class="action-card-icon" aria-hidden="true">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <!-- グラフ全体の基準となる横軸 -->
                                <path d="M3 21h18"></path>

                                <!-- 左側の短い棒 -->
                                <path d="M6 21v-6"></path>

                                <!-- 中央の高い棒 -->
                                <path d="M12 21V8"></path>

                                <!-- 右側の中くらいの棒 -->
                                <path d="M18 21v-9"></path>
                            </svg>
                        </span>
                        <span class="action-card-title">サマリー</span>
                        <span class="action-card-description">状況を確認する</span>
                    </button>
                </div>
            </section>

            <!-- 顧客数や売上など、ホーム画面の主要な数値を表示する集計エリア -->
            <section class="stats-summary" aria-label="顧客データ集計">

                <!-- 項目名と数値を組み合わせた集計一覧 -->
                <dl class="stats-grid">

                    <!-- 登録されている顧客数 -->
                    <div class="stat-item">
                        <dt class="stat-label">顧客数</dt>
                        <dd class="stat-value">
                            128<span class="stat-unit">名</span>
                        </dd>
                        <dd class="stat-description">登録済みのお客様</dd>
                    </div>

                    <!-- 全期間の売上合計 -->
                    <div class="stat-item">
                        <dt class="stat-label">累計売上</dt>
                        <dd class="stat-value">¥5,480,000</dd>
                        <dd class="stat-description">全期間の累計売上</dd>
                    </div>

                    <!-- 今月誕生日を迎える顧客数 -->
                    <div class="stat-item">
                        <dt class="stat-label">今月誕生日</dt>
                        <dd class="stat-value">
                            9<span class="stat-unit">名</span>
                        </dd>
                        <dd class="stat-description">今月お誕生日のお客様</dd>
                    </div>

                    <!-- 今月新しく登録された顧客数 -->
                    <div class="stat-item">
                        <dt class="stat-label">今月登録</dt>
                        <dd class="stat-value">
                            12<span class="stat-unit">名</span>
                        </dd>
                        <dd class="stat-description">今月の新規登録</dd>
                    </div>
                </dl>
            </section>
        </main>
    </body>
</html>
