<!DOCTYPE html>
<html lang="ja">
    <head><!-- ページのタイトルや文字コードなど、画面に直接表示されない設定を書く場所 -->
        <!-- 日本語などを文字化けせず表示するため、文字コードをUTF-8に設定 -->
        <meta charset="UTF-8">
        <!-- スマートフォンでも画面幅に合わせて表示するための設定 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- ブラウザのタブに表示されるページタイトル -->
        <title>顧客管理Webアプリ</title>

        <!-- 画面の見た目を管理するCSSファイルを読み込む -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body><!-- ここから、ユーザーの画面に実際に表示される内容を書く -->
        <!-- ページ内で最も重要なメイン見出し -->
        <h1>顧客管理Webアプリ</h1>

        <!-- プロジェクトの現在の状態を説明する文章 -->
        <p>ポートフォリオ Ver.1 制作スタート！</p>
</body>
</html>
