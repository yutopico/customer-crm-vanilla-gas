<!DOCTYPE html>
<html lang="ja">
    <head><!-- ページのタイトルや文字コードなど、画面に直接表示されない設定を書く場所 -->
        <!-- 日本語などを文字化けせず表示するため、文字コードをUTF-8に設定 -->
        <meta charset="UTF-8">
        <!-- スマートフォンでも画面幅に合わせて表示するための設定 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- ブラウザのタブに表示されるページタイトル -->
        <title>顧客管理Webアプリ</title>

        <!-- 画面の見た目を管理するCSSファイルを読み込む -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body><!-- ここから、ユーザーの画面に実際に表示される内容を書く -->
        <!-- アプリ画面の主要な内容をまとめる領域 -->
        <main class="app-container">
            <!-- アプリ名や説明をまとめるヘッダー領域 -->
            <header class="top-header">
                <!-- ロゴ・アプリ名・キャッチコピーをまとめる領域 -->
                <div class="brand">
                    <!-- 装飾用のロゴ。内容を持たないため読み上げ対象から外す -->
                    <div class="brand-logo" aria-hidden="true"></div>

                    <!-- アプリ名とキャッチコピー -->
                    <div class="brand-text">
                        <h1>顧客管理</h1>
                        <p>顧客情報を、もっとスマートに。</p>
                    </div>
                </div>

                <!-- お知らせとメニューの操作ボタン -->
                <div class="header-actions">
                    <!-- type="button"で通常の操作ボタンとして扱う -->
                    <button class="icon-button" type="button" aria-label="お知らせ">
                        <span aria-hidden="true">🔔</span>
                        <span class="action-label">お知らせ</span>
                    </button>

                    <button class="icon-button" type="button" aria-label="メニュー">
                        <span aria-hidden="true">☰</span>
                        <span class="action-label">メニュー</span>
                    </button>
                </div>
                
            </header>
        </main>
</body>
</html>
