  background-color: rgb(253 250 246 / 72%);
  border: 1px dashed rgb(129 134 133 / 30%);
  border-radius: 22px;

  text-align: center;
}

/* hidden属性がある間は空表示を隠す */
.customer-search-empty-state[hidden] {
  display: none;
}

/* 顧客が見つからない場合の虫眼鏡アイコン */
.customer-search-empty-icon {
  display: grid;
  place-items: center;

  width: 58px;
  height: 58px;

  background-color: rgb(245 177 135 / 20%);
  border: 1px solid rgb(245 177 135 / 36%);
  border-radius: 50%;

  color: #d98557;
}

/* 虫眼鏡アイコンのSVG */
.customer-search-empty-icon svg {
  display: block;

  width: 29px;
  height: 29px;
}

/* 空表示のタイトル */
.customer-search-empty-state h3 {
  margin: 16px 0 0;

  color: #515254;
  font-size: 18px;
}

/* 空表示の説明 */
.customer-search-empty-state p {
  margin: 10px 0 0;

  color: #818685;
  font-size: 14px;
  line-height: 1.7;
}

/* 条件をリセットするボタン */
.customer-search-reset-button {
  min-height: 44px;
  margin-top: 22px;
  padding: 10px 20px;

  background-color: #7d9680;
  border: 1px solid #7d9680;
  border-radius: 999px;

  color: #ffffff;
  font: inherit;
  font-weight: 700;

  cursor: pointer;
}

/* 読み込み中 */
.customer-search-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  margin-top: 22px;

  color: #818685;
  font-size: 13px;
}

/* hidden属性が付いている間は隠す */
.customer-search-loading[hidden] {
  display: none;
}

/* 読み込み中の円 */
.customer-search-loading-spinner {
  width: 22px;
  height: 22px;

  border: 3px solid rgb(125 150 128 / 18%);
  border-top-color: #7d9680;
  border-radius: 50%;

  animation:
    customer-search-loading-spin 0.8s linear infinite;
}

/* 読み込み中アニメーション */
@keyframes customer-search-loading-spin {
  to {
    transform: rotate(360deg);
  }
}

/* さらに読み込むボタン */
.customer-search-load-more {
  width: 100%;
  min-height: 48px;
  margin-top: 20px;

  background-color: transparent;
  border: 1px solid rgb(125 150 128 / 40%);
  border-radius: 14px;

  color: #6d856f;
  font: inherit;
  font-weight: 700;

  cursor: pointer;
}

/* PC右側のサイドバー */
.customer-search-sidebar {
  position: sticky;
  top: 24px;

  display: grid;
  gap: 18px;
}

/* 並び替え・条件カード */
.customer-search-side-card {
  padding: 22px;

  background-color: #fdfaf6;
  border: 1px solid rgb(129 134 133 / 16%);
  border-radius: 22px;

  box-shadow:
    0 10px 28px rgb(81 82 84 / 8%);
}

/* サイドカードタイトル */
.customer-search-side-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* サイドカードタイトル文字 */
.customer-search-side-title h3 {
  margin: 0;

  color: #515254;
  font-size: 16px;
}

/* 検索条件カードのヘッダー */
.customer-search-side-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

/* 条件リセットボタン */
.customer-search-condition-reset {
  padding: 5px 0;

  background-color: transparent;
  border: none;

  color: #7d9680;
  font: inherit;
  font-size: 12px;
  font-weight: 700;

  cursor: pointer;
}

/* 並び替え一覧 */
.customer-search-sort-options {
  display: grid;
  gap: 4px;

  margin: 18px 0 0;
  padding: 0;

  border: none;
}

/* 並び替え1件 */
.customer-search-sort-option {
  display: flex;
  align-items: center;
  gap: 10px;

  min-height: 42px;
  padding: 8px 6px;

  color: #515254;
  font-size: 14px;

  cursor: pointer;
}

/* 並び替えラジオボタン */
.customer-search-sort-option input {
  width: 18px;
  height: 18px;

  accent-color: #7d9680;
}

/* 検索条件一覧 */
.customer-search-condition-list {
  display: grid;

  margin-top: 18px;

  border-top:
    1px solid rgb(129 134 133 / 14%);
}

/* 検索条件1件 */
.customer-search-condition-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  min-height: 50px;
  padding: 12px 2px;

  background-color: transparent;
  border: none;
  border-bottom:
    1px solid rgb(129 134 133 / 14%);

  color: #515254;
  font: inherit;
  font-size: 13px;
  text-align: left;

  cursor: pointer;
}

/* 検索条件のアイコンと項目名 */
.customer-search-condition-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;

  min-width: 0;
}

/* 検索条件のアイコン */
.customer-search-condition-row-icon {
  display: grid;
  place-items: center;

  flex: 0 0 auto;

  width: 20px;
  height: 20px;

  color: #7d9680;
}

/* 検索条件のSVG */
.customer-search-condition-row-icon svg {
  display: block;

  width: 100%;
  height: 100%;
}

/* 現在の検索条件 */
.customer-search-condition-value {
  color: #818685;
  font-size: 12px;
}

/* この条件で検索ボタン */
.customer-search-condition-submit {
  width: 100%;
  min-height: 50px;
  margin-top: 22px;
  padding: 12px 18px;

  background-color: #7d9680;
  border: 1px solid #7d9680;
  border-radius: 14px;

  box-shadow:
    0 8px 20px rgb(125 150 128 / 22%);

  color: #ffffff;
  font: inherit;
  font-weight: 700;

  cursor: pointer;
}

/* 一番上へ戻る縦型ボタン */
.customer-search-scroll-top {
  position: fixed;
  right: 20px;
  bottom: 108px;
  z-index: 100;

  width: 52px;
  height: 108px;
  padding: 0;

  background-color: transparent;
  border: none;

  color: #d98f68;
  font: inherit;

  cursor: pointer;

  transition:
    opacity 0.2s ease,
    visibility 0.2s ease,
    color 0.2s ease,
    transform 0.2s ease;
  
  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transform: translateY(8px);
}

/* スクロール後にTOPボタンを表示する */
.customer-search-scroll-top--visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;

  transform: translateY(0);
}

/* 縦向きに配置するTOPの文字 */
.customer-search-scroll-top-text {
  position: absolute;
  top: 50px;
  left: -7px;

  display: block;

  width: 46px;

  color: currentColor;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.16em;
  line-height: 1;
  white-space: nowrap;

  transform: rotate(90deg);
}

/* 縦線と矢印 */
.customer-search-scroll-top-arrow {
  position: absolute;
  top: 0;
  right: 0;

  display: block;

  width: 30px;
  height: 108px;

  overflow: visible;
}

/* マウスを乗せたとき */
.customer-search-scroll-top:hover {
  color: #c97952;

  transform: translateY(-3px);
}

/* キーボード操作時の選択表示 */
.customer-search-scroll-top:focus-visible {
  outline: 2px solid #7d9680;
  outline-offset: 4px;
  border-radius: 4px;
}

/* スマホ用パネル全体 */
.customer-search-mobile-panel {
  position: fixed;
  inset: 0;
  z-index: 2200;

  display: grid;
  align-items: end;

  padding: 18px;

  background-color: rgb(81 82 84 / 48%);
  backdrop-filter: blur(5px);
}

/* hidden属性が付いている間はパネルを隠す */
.customer-search-mobile-panel[hidden] {
  display: none;
}

/* スマホ用パネルのカード */
.customer-search-mobile-panel-content {
  width: 100%;
  max-height: calc(100dvh - 36px);
  padding: 24px;

  background-color: #fdfaf6;
  border-radius: 24px;

  box-shadow:
    0 22px 60px rgb(81 82 84 / 28%);

  overflow-y: auto;
}

/* スマホ用パネルのヘッダー */
.customer-search-mobile-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

/* スマホ用パネルタイトル */
.customer-search-mobile-panel-header h2 {
  margin: 0;

  color: #515254;
  font-size: 22px;
}

/* パネルを閉じるボタン */
.customer-search-mobile-panel-close {
  display: grid;
  place-items: center;

  width: 38px;
  height: 38px;
  padding: 0;

  background-color: rgb(125 150 128 / 12%);
  border: none;
  border-radius: 50%;

  color: #607862;
  font: inherit;
  font-size: 22px;

  cursor: pointer;
}

/* スマホ用パネルの決定ボタン */
.customer-search-mobile-panel-submit {
  width: 100%;
  min-height: 50px;
  margin-top: 22px;
  padding: 12px 18px;

  background-color: #7d9680;
  border: 1px solid #7d9680;
  border-radius: 14px;

  color: #ffffff;
  font: inherit;
  font-weight: 700;

  cursor: pointer;
}

/* スマホ用詳細条件パネルの下部ボタン */
.customer-search-mobile-panel-actions {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 10px;

  margin-top: 22px;
}

/* スマホ用条件リセット */
.customer-search-mobile-condition-reset {
  min-height: 50px;
  padding: 12px 16px;

  background-color: transparent;
  border: 1px solid #7d9680;
  border-radius: 14px;

  color: #607862;
  font: inherit;
  font-weight: 700;

  cursor: pointer;
}

/* 横並び時は決定ボタンの余白を消す */
.customer-search-mobile-panel-actions
.customer-search-mobile-panel-submit {
  margin-top: 0;
}

/* 詳細条件の選択肢パネル */
.customer-search-condition-choice-panel {
  z-index: 2300;

  align-items: center;
  justify-items: center;
}

/* 詳細条件の選択肢カード */
.customer-search-condition-choice-content {
  width: min(420px, 100%);
}

/* 詳細条件の選択肢一覧 */
.customer-search-condition-choice-options {
  display: grid;
  gap: 8px;

  margin-top: 18px;
}

/* 詳細条件の選択肢ボタン */
.customer-search-condition-choice-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;

  width: 100%;
  min-height: 48px;
  padding: 12px 16px;

  background-color: #ffffff;
  border: 1px solid rgb(129 134 133 / 18%);
  border-radius: 14px;

  color: #515254;
  font: inherit;
  font-size: 14px;
  text-align: left;

  cursor: pointer;

  transition:
    background-color 0.2s ease,
    border-color 0.2s ease;
}

/* 選択中の詳細条件 */
.customer-search-condition-choice-button--active {
  background-color: rgb(125 150 128 / 12%);
  border-color: #7d9680;

  color: #607862;
  font-weight: 700;
}

/* 選択中を表す丸 */
.customer-search-condition-choice-check {
  display: grid;
  place-items: center;
  flex: 0 0 auto;

  width: 20px;
  height: 20px;

  border: 1px solid rgb(125 150 128 / 45%);
  border-radius: 50%;

  color: transparent;
  font-size: 12px;
}

/* 選択中の丸へチェックを表示する */
.customer-search-condition-choice-button--active
.customer-search-condition-choice-check {
  background-color: #7d9680;
  border-color: #7d9680;

  color: #ffffff;
}

/* 条件が選択されている行 */
.customer-search-condition-row--selected
.customer-search-condition-value {
  color: #607862;
  font-weight: 700;
}

@media (max-width: 600px) {
  .customer-search-condition-choice-panel {
    align-items: end;
  }

  .customer-search-condition-choice-content {
    width: 100%;
  }
}


/* ==================================================
   14. 顧客詳細画面
   概要・タイムライン・売上
================================================== */
/* 顧客詳細画面では共通ヘッダーと下部ナビを隠す */
body.customer-detail-mode {
  padding-bottom: 0;

  background-color: #e1d2c0;
}

body.customer-detail-mode .top-header,
body.customer-detail-mode .bottom-navigation {
  display: none;
}

/* 顧客詳細画面だけ中央の横幅を少し狭くする */
body.customer-detail-mode .app-container {
  max-width: 880px;
  padding-top: 18px;
  padding-bottom: 40px;
}

/* 検索結果に残っている顧客ランクを表示しない */
.customer-search-result-card .customer-rank {
  display: none;
}

/* 顧客詳細の内側 */
.customer-detail-shell {
  display: grid;
  gap: 14px;
}

/* 顧客一覧へ戻る行 */
.customer-detail-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* 顧客一覧へ戻るボタン */
.customer-detail-back-button {
  display: inline-flex;
  align-items: center;
  gap: 5px;

  min-height: 40px;
  padding: 6px 2px;

  background-color: transparent;
  border: none;

  color: #607862;
  font: inherit;
  font-size: 13px;

  cursor: pointer;
}

/* 戻る矢印 */
.customer-detail-back-button svg {
  width: 19px;
  height: 19px;
}

/* 写真とプロフィールのカード */
.customer-detail-hero-card {
  display: grid;
  grid-template-columns:
    142px minmax(0, 1fr);
  align-items: center;
  gap: 24px;

  padding: 20px;

  background-color: #fffdf9;
  border: 1px solid rgb(129 134 133 / 15%);
  border-radius: 18px;

  box-shadow:
    0 8px 24px rgb(81 82 84 / 7%);
}

/* メイン写真 */
.customer-detail-main-photo {
  position: relative;

  display: grid;
  place-items: center;

  width: 142px;
  height: 142px;

  background:
    linear-gradient(
      145deg,
      #e5e8df,
      #cfd8c9
    );
  border-radius: 13px;

  overflow: hidden;
}

/* 顧客詳細上部の代表写真 */
.customer-detail-main-photo-image {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
}

/* 写真未登録 */
.customer-detail-main-photo--empty {
  background:
    linear-gradient(
      145deg,
      #eee8de,
      #e4ddd2
    );
}

/* 写真部分の頭文字 */
.customer-detail-main-photo-initial {
  color: #607862;
  font-size: 48px;
  font-weight: 700;
}

/* 写真の登録状態 */
.customer-detail-photo-status {
  position: absolute;
  right: 8px;
  bottom: 8px;

  padding: 4px 7px;

  background-color: rgb(255 253 249 / 88%);
  border-radius: 999px;

  color: #607862;
  font-size: 9px;

  backdrop-filter: blur(5px);
}

/* 名前周辺 */
.customer-detail-hero-information {
  display: grid;
  gap: 12px;

  min-width: 0;
}

/* 名前と編集ボタン */
.customer-detail-name-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

/* 顧客名 */
.customer-detail-name-row h2 {
  margin: 0;

  color: #3f4543;
  font-size: clamp(25px, 5vw, 36px);
  letter-spacing: 0.06em;
}

/* 上部編集ボタン */
.customer-detail-edit-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-shrink: 0;

  min-height: 44px;
  padding: 9px 16px;

  background-color: #f1e8dc;
  border: 1px solid #c9bdaf;
  border-radius: 10px;

  color: #515254;
  font: inherit;
  font-size: 13px;

  cursor: pointer;

  transition:
    background-color 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease;
}

/* 編集アイコン */
.customer-detail-edit-button svg {
  width: 19px;
  height: 19px;

  color: #607862;

  flex-shrink: 0;
}

/* 編集ボタンにマウスを乗せたとき */
.customer-detail-edit-button:hover {
  background-color: #e3e8e4;
  border-color: #7d9680;

  color: #607862;
}

/* 顧客番号 */
.customer-detail-id {
  margin: 0;

  color: #606563;
  font-size: 15px;
}

/* 最終来店情報 */
.customer-detail-last-visit {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;

  color: #818685;
  font-size: 13px;
}

/* 最終来店日 */
.customer-detail-last-visit strong {
  color: #515254;
  font-size: 16px;
}

/* 最終来店からの日数 */
.customer-detail-last-visit small {
  color: #818685;
  font-size: 12px;
}

/* 3つのタブ */
.customer-detail-tabs {
  position: sticky;
  top: 8px;
  z-index: 20;

  display: grid;
  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  padding: 3px;

  background-color: rgb(247 243 236 / 94%);
  border: 1px solid rgb(129 134 133 / 13%);
  border-radius: 12px;

  backdrop-filter: blur(12px);
}

/* タブボタン */
.customer-detail-tab-button {
  min-height: 43px;
  padding: 9px 10px;

  background-color: transparent;
  border: none;
  border-radius: 9px;

  color: #606563;
  font: inherit;
  font-size: 14px;
  font-weight: 700;

  cursor: pointer;

  transition:
    background-color 0.2s ease,
    color 0.2s ease;
}

/* 選択中のタブ */
.customer-detail-tab-button--active {
  background-color: #7d9680;

  color: #ffffff;
}

/* タブの中身 */
.customer-detail-panel {
  display: grid;
  gap: 12px;
}

/* 非表示のタブ */
.customer-detail-panel[hidden] {
  display: none;
}

/* 共通カード */
.customer-detail-section-card {
  padding: 18px;

  background-color: #fffdf9;
  border: 1px solid rgb(129 134 133 / 15%);
  border-radius: 14px;

  box-shadow:
    0 5px 16px rgb(81 82 84 / 5%);
}

/* カード上部 */
.customer-detail-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;

  margin-bottom: 13px;
}

/* カード見出し */
.customer-detail-section-header h3 {
  margin: 0;

  color: #454b49;
  font-size: 16px;
}

/* カード右側の小さな文字 */
.customer-detail-section-header > span {
  color: #818685;
  font-size: 11px;
}

/* 小さな編集ボタン */
.customer-detail-section-edit {
  min-height: 32px;
  padding: 5px 14px;

  background-color: transparent;
  border: 1px solid #c9bdaf;
  border-radius: 8px;

  color: #515254;
  font: inherit;
  font-size: 12px;

  cursor: pointer;
}

/* 基本情報一覧 */
.customer-detail-basic-list {
  display: grid;

  margin: 0;
}

/* 基本情報1件 */
.customer-detail-basic-list > div {
  display: grid;
  grid-template-columns:
    130px minmax(0, 1fr);
  gap: 18px;

  padding: 11px 4px;

  border-bottom:
    1px solid rgb(129 134 133 / 11%);
}

/* 最後の基本情報 */
.customer-detail-basic-list > div:last-child {
  border-bottom: none;
}

/* 基本情報の項目名 */
.customer-detail-basic-list dt {
  color: #818685;
  font-size: 12px;
}

/* 基本情報の内容 */
.customer-detail-basic-list dd {
  margin: 0;

  color: #454b49;
  font-size: 13px;
  font-weight: 700;
}

/* 年齢 */
.customer-detail-basic-list dd small {
  margin-left: 7px;

  color: #818685;
  font-size: 11px;
  font-weight: 400;
}

/* 来店サマリー */
.customer-detail-summary-grid {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 8px;

  margin: 0;
}

/* 来店サマリー1件 */
.customer-detail-summary-grid > div {
  display: grid;
  gap: 5px;

  min-height: 108px;
  padding: 13px;

  background-color: rgb(227 232 228 / 40%);
  border: 1px solid rgb(125 150 128 / 11%);
  border-radius: 10px;

  text-align: center;
}

/* 来店サマリーの見出し */
.customer-detail-summary-grid dt {
  color: #818685;
  font-size: 11px;
}

/* 来店サマリーの数値 */
.customer-detail-summary-grid dd {
  margin: 0;

  color: #607862;
  font-size: 22px;
  font-weight: 700;
}

/* 来店サマリーの補足 */
.customer-detail-summary-grid small {
  color: #818685;
  font-size: 10px;
}

/* 特徴一覧 */
.customer-detail-feature-list {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

/* 特徴タグ */
.customer-detail-feature-tag {
  padding: 6px 13px;

  background-color: #e3e8e4;
  border-radius: 999px;

  color: #5f7261;
  font-size: 12px;
}

/* 特徴が未登録の場合 */
.customer-detail-feature-empty {
  color: #818685;
  font-size: 13px;
}

/* 顧客メモ */
.customer-detail-customer-memo {
  min-height: 100px;
  margin: 0;
  padding: 14px;

  background-color: #f8f5ee;
  border: 1px solid #e4ddd2;
  border-radius: 10px;

  color: #515254;
  font-size: 13px;
  line-height: 1.9;
  white-space: pre-wrap;
}

/* 写真一覧 */
.customer-detail-gallery-list {
  display: flex;
  gap: 9px;

  overflow-x: auto;
  scrollbar-width: thin;
}

/* 写真をドラッグしている間のギャラリー */
.customer-detail-gallery-list--dragging {
  background-color:
    rgb(125 150 128 / 10%);

  border-radius: 12px;

  outline:
    2px dashed #7d9680;

  outline-offset: 5px;

  box-shadow:
    0 0 0 6px
    rgb(125 150 128 / 8%);
}

/* 写真1件 */
.customer-detail-gallery-item {
  display: grid;
  place-items: center;
  align-content: center;
  gap: 7px;
  flex: 0 0 118px;

  height: 104px;
  padding: 10px;

  background:
    linear-gradient(
      145deg,
      #e7e9e3,
      #d5ddcf
    );
  border: 1px solid rgb(129 134 133 / 13%);
  border-radius: 10px;

  color: #607862;
  text-align: center;
}

/* 実際の顧客写真を表示するカード */
.customer-detail-gallery-item--photo {
  position: relative;

  padding: 0;

  overflow: hidden;
}

/* 顧客詳細の代表写真変更ボタン */
.customer-detail-gallery-representative {
  position: absolute;
  left: 6px;
  bottom: 6px;

  padding: 5px 7px;

  background-color:
    rgb(255 253 249 / 90%);

  border: 1px solid
    rgb(125 150 128 / 22%);

  border-radius: 999px;

  color: #607862;
  font-size: 9px;
  font-weight: 700;

  cursor: pointer;
}

.customer-detail-gallery-representative--active {
  background-color: #7d9680;
  border-color: #7d9680;

  color: #ffffff;
}

/* 顧客写真を1枚だけ削除するボタン */
.customer-detail-gallery-remove {
  position: absolute;
  top: 6px;
  right: 6px;

  display: grid;
  place-items: center;

  width: 26px;
  height: 26px;
  padding: 0;

  background-color:
    rgb(255 253 249 / 90%);

  border: none;
  border-radius: 50%;

  color: #818685;
  font-size: 17px;
  line-height: 1;

  box-shadow:
    0 3px 10px
    rgb(81 82 84 / 16%);

  cursor: pointer;

  transition:
    background-color 0.18s ease,
    color 0.18s ease,
    transform 0.18s ease;
}

/* 削除ボタンへマウスを重ねたとき */
.customer-detail-gallery-remove:hover {
  background-color: #c97863;

  color: #ffffff;

  transform: scale(1.06);
}

/* キーボード操作時 */
.customer-detail-gallery-remove:focus-visible {
  outline:
    3px solid
    rgb(245 177 135 / 55%);

  outline-offset: 2px;
}

/* 顧客写真 */
.customer-detail-gallery-image {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: cover;
}

/* 写真アイコン */
.customer-detail-gallery-item svg {
  width: 25px;
  height: 25px;
}

/* 写真名 */
.customer-detail-gallery-item span {
  font-size: 10px;
}

/* 写真未登録 */
.customer-detail-gallery-item--empty {
  background-color: #f5f1ea;
  background-image: none;
  border-style: dashed;

  color: #818685;
}

/* 画面下部の2ボタン */
.customer-detail-bottom-actions {
  display: grid;
  grid-template-columns:
    minmax(0, 0.8fr)
    minmax(0, 1.2fr);
  gap: 10px;

  margin-top: 2px;
  padding: 12px;

  background-color: rgb(255 253 249 / 92%);
  border: 1px solid rgb(129 134 133 / 13%);
  border-radius: 14px;

  box-shadow:
    0 8px 22px rgb(81 82 84 / 7%);
}

/* 下部の編集ボタンと来店登録ボタン */
.customer-detail-bottom-edit,
.customer-detail-register-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;

  min-height: 46px;
  padding: 10px 14px;

  border-radius: 999px;

  font: inherit;
  font-size: 13px;
  font-weight: 700;

  cursor: pointer;
}

/* 下部編集ボタン */
.customer-detail-bottom-edit {
  background-color: transparent;
  border: 1px solid #c9bdaf;

  color: #515254;
}

/* 来店登録ボタン */
.customer-detail-register-button {
  background-color: #7d9680;
  border: 1px solid #7d9680;

  color: #ffffff;
}

/* 下部ボタンのアイコン */
.customer-detail-bottom-edit svg,
.customer-detail-register-button svg {
  width: 18px;
  height: 18px;
}

/* タイムライン上部 */
.customer-detail-timeline-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;

  padding: 4px 2px;
}

/* 来店履歴の文字 */
.customer-detail-timeline-toolbar > span {
  color: #515254;
  font-size: 15px;
  font-weight: 700;
}

/* タイムライン上部の登録ボタン */
.customer-detail-timeline-register {
  min-height: 38px;
  padding: 7px 14px;

  background-color: transparent;
  border-color: #7d9680;
  border-radius: 9px;

  color: #607862;
}

/* タイムライン一覧 */
.customer-detail-timeline-list {
  display: grid;
}

/* タイムライン1件 */
.customer-detail-timeline-item {
  display: grid;
  grid-template-columns:
    92px minmax(0, 1fr);
  gap: 20px;
}

/* 左側の日付 */
.customer-detail-timeline-date {
  position: relative;

  display: grid;
  align-content: start;
  justify-items: end;
  gap: 2px;

  padding: 17px 16px 28px 0;

  border-right:
    1px solid rgb(125 150 128 / 35%);
}

/* タイムラインの丸 */
.customer-detail-timeline-date::after {
  content: "";

  position: absolute;
  top: 28px;
  right: -5px;

  width: 9px;
  height: 9px;

  background-color: #7d9680;
  border: 2px solid #f5f1ea;
  border-radius: 50%;
}

/* 年 */
.customer-detail-timeline-date span {
  color: #818685;
  font-size: 10px;
}

/* 月日 */
.customer-detail-timeline-date strong {
  color: #515254;
  font-size: 17px;
  line-height: 1.15;
}

/* 何日前 */
.customer-detail-timeline-date small {
  color: #818685;
  font-size: 9px;
}

/* 右側の来店カード */
.customer-detail-timeline-card {
  display: grid;
  gap: 10px;

  margin-bottom: 10px;
  padding: 15px;

  background-color: #fffdf9;
  border: 1px solid rgb(129 134 133 / 15%);
  border-radius: 12px;

  box-shadow:
    0 5px 15px rgb(81 82 84 / 5%);
}

/* 会計金額・担当・来店回数 */
.customer-detail-timeline-card-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 11px;
}

/* 会計金額 */
.customer-detail-timeline-card-header strong {
  margin-right: auto;

  color: #454b49;
  font-size: 19px;
}

/* 担当スタッフ */
.customer-detail-timeline-staff {
  color: #607862;
  font-size: 11px;
}

/* 何回目の来店か */
.customer-detail-timeline-count {
  padding: 3px 7px;

  background-color: rgb(245 177 135 / 13%);
  border: 1px solid rgb(245 177 135 / 44%);
  border-radius: 5px;

  color: #d78151;
  font-size: 9px;
}

/* タイムラインのメモ */
.customer-detail-timeline-memo {
  margin: 0;

  color: #515254;
  font-size: 12px;
  line-height: 1.75;
  white-space: pre-wrap;
}

/* 読み込み中 */
.customer-detail-timeline-loading {
  margin: 8px 0;

  color: #818685;
  font-size: 12px;
  text-align: center;
}

/* さらに読み込むボタン */
.customer-detail-timeline-load-more {
  width: 100%;
  min-height: 42px;

  background-color: transparent;
  border: 1px solid #c9bdaf;
  border-radius: 9px;

  color: #606563;
  font: inherit;
  font-size: 12px;

  cursor: pointer;
}

/* 売上画面の2列配置 */
.customer-detail-sales-grid {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 12px;
}

/* 売上グラフ */
.customer-detail-sales-chart {
  display: grid;
  grid-template-columns:
    repeat(6, minmax(0, 1fr));
  align-items: end;
  gap: 10px;

  min-height: 210px;
  padding: 18px 6px 0;

  border-bottom:
    1px solid rgb(129 134 133 / 18%);
}

/* グラフ1か月分 */
.customer-detail-sales-bar-item {
  display: grid;
  grid-template-rows:
    20px 150px 20px;
  align-items: end;
  gap: 5px;

  min-width: 0;

  text-align: center;
}

/* 売上金額 */
.customer-detail-sales-bar-item small {
  color: #818685;
  font-size: 8px;
}

/* 棒グラフの領域 */
.customer-detail-sales-bar-track {
  position: relative;

  width: 100%;
  height: 150px;
}

/* 売上の棒 */
.customer-detail-sales-bar {
  position: absolute;
  right: 16%;
  bottom: 0;
  left: 16%;

  height: var(--bar-height);

  min-height: 4px;

  background:
    linear-gradient(
      180deg,
      #91a791,
      #718a73
    );
  border-radius: 5px 5px 0 0;
}

/* 月 */
.customer-detail-sales-bar-item span {
  color: #606563;
  font-size: 10px;
}

/* 分析一覧 */
.customer-detail-analysis-list {
  display: grid;
  gap: 0;

  margin: 0;
}

/* 分析1項目 */
.customer-detail-analysis-list > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;

  padding: 11px 2px;

  border-bottom:
    1px solid rgb(129 134 133 / 11%);
}

/* 最後の分析項目 */
.customer-detail-analysis-list > div:last-child {
  border-bottom: none;
}

/* 分析項目名 */
.customer-detail-analysis-list dt {
  color: #818685;
  font-size: 11px;
}

/* 分析数値 */
.customer-detail-analysis-list dd {
  margin: 0;

  color: #515254;
  font-size: 13px;
  font-weight: 700;
  text-align: right;
}

/* 最も多い曜日 */
.customer-detail-weekday-summary {
  display: flex;
  align-items: baseline;
  gap: 7px;

  margin-bottom: 15px;
}

/* 曜日名 */
.customer-detail-weekday-summary strong {
  color: #607862;
  font-size: 23px;
}

/* 補足文 */
.customer-detail-weekday-summary span {
  color: #818685;
  font-size: 12px;
}

/* 曜日ごとの回数 */
.customer-detail-weekday-list {
  display: grid;
  gap: 8px;
}

/* 曜日1件 */
.customer-detail-weekday-item {
  display: grid;
  grid-template-columns:
    34px minmax(0, 1fr) 42px;
  align-items: center;
  gap: 10px;
}

/* 曜日名と回数 */
.customer-detail-weekday-item span,
.customer-detail-weekday-item strong {
  color: #606563;
  font-size: 11px;
}

/* 曜日バーの背景 */
.customer-detail-weekday-track {
  height: 7px;

  background-color: #ece8e1;
  border-radius: 999px;

  overflow: hidden;
}

/* 曜日バー */
.customer-detail-weekday-bar {
  width: var(--weekday-width);
  height: 100%;

  background-color: #7d9680;
  border-radius: inherit;
}

/* 好みと傾向 */
.customer-detail-tendency-list {
  display: grid;
  gap: 7px;

  margin: 0;
  padding-left: 20px;

  color: #515254;
  font-size: 13px;
  line-height: 1.7;
}

/* 編集モーダルを閉じている状態 */
.customer-detail-edit-dialog[hidden] {
  display: none;
}

/* 編集モーダル */
.customer-detail-edit-dialog {
  position: fixed;
  inset: 0;
  z-index: 2400;

  display: grid;
  place-items: center;

  padding: 20px;

  background-color: rgb(81 82 84 / 32%);
  backdrop-filter: blur(4px);
}

/* 編集内容 */
.customer-detail-edit-content {
  width: min(100%, 600px);
  max-height: calc(100dvh - 40px);
  padding: 22px;

  background-color: #fffdf9;
  border-radius: 18px;

  box-shadow:
    0 24px 70px rgb(81 82 84 / 24%);

  overflow-y: auto;
}

/* 編集画面上部 */
.customer-detail-edit-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;

  margin-bottom: 20px;
}

/* 編集画面タイトル */
.customer-detail-edit-header h2 {
  margin: 0;

  color: #454b49;
  font-size: 21px;
}

/* 編集画面を閉じるボタン */
.customer-detail-edit-close {
  width: 38px;
  height: 38px;

  background-color: transparent;
  border: none;

  color: #515254;
  font-size: 24px;

  cursor: pointer;
}

/* 編集フォーム */
#customer-detail-edit-form {
  display: grid;
  gap: 16px;
}

/* 編集項目 */
.customer-detail-edit-field {
  display: grid;
  gap: 7px;

  color: #515254;
  font-size: 12px;
  font-weight: 700;
}

/* 編集欄 */
.customer-detail-edit-field input,
.customer-detail-edit-field select,
.customer-detail-edit-field textarea {
  width: 100%;
  padding: 12px 13px;

  background-color: #ffffff;
  border: 1px solid #d6cabd;
  border-radius: 9px;

  color: #515254;
  font: inherit;
  font-size: 14px;
}

/* 編集欄の補足 */
.customer-detail-edit-field small {
  color: #818685;
  font-size: 10px;
  font-weight: 400;
}

/* 顧客詳細編集の特徴タグ一覧 */
.customer-detail-edit-feature-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}


/* 編集モーダル内ではタグを少しコンパクトにする */
.customer-detail-edit-feature-list
.feature-chip {
  min-width: 0;
  padding: 8px 12px;

  font-size: 12px;
}


/* 新しい特徴の入力欄と追加ボタン */
.customer-detail-edit-feature-add-row {
  display: grid;
  grid-template-columns:
    minmax(0, 1fr)
    auto;
  gap: 8px;
}


/* 特徴追加ボタン */
.customer-detail-edit-feature-add-button {
  min-width: 72px;
  padding: 0 16px;

  background-color: transparent;
  border: 1px solid #f5b187;
  border-radius: 9px;

  color: #d9824e;
  font: inherit;
  font-size: 13px;
  font-weight: 700;

  cursor: pointer;
}


/* 追加ボタンへマウスを乗せたとき */
.customer-detail-edit-feature-add-button:hover:not(
  :disabled
) {
  background-color:
    rgb(245 177 135 / 14%);
}


/* 保存中は特徴タグと追加ボタンも操作不可と分かるようにする */
.customer-detail-edit-feature-chip:disabled,
.customer-detail-edit-feature-add-button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

/* 編集画面下部 */
.customer-detail-edit-actions {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 10px;

  margin-top: 6px;
}

/* キャンセルと保存 */
.customer-detail-edit-cancel,
.customer-detail-edit-save {
  min-height: 45px;

  border-radius: 999px;

  font: inherit;
  font-size: 13px;
  font-weight: 700;

  cursor: pointer;
}

/* キャンセル */
.customer-detail-edit-cancel {
  background-color: transparent;
  border: 1px solid #c9bdaf;

  color: #515254;
}

/* 保存 */
.customer-detail-edit-save {
  background-color: #7d9680;
  border: 1px solid #7d9680;

  color: #ffffff;
}

/* 保存・更新処理中の離脱ボタンは
   操作できないことが分かる見た目にする */
.new-customer-confirm-back:disabled,
.regular-customer-confirm-back:disabled,
.customer-detail-edit-cancel:disabled,
.customer-detail-edit-close:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}


/* 顧客詳細の保存処理中 */
.customer-detail-edit-save:disabled {
  background-color: #c9bdaf;
  border-color: #c9bdaf;
  opacity: 0.75;

  cursor: wait;
}

/* 顧客詳細画面のタブレット・スマホ表示 */
@media (max-width: 768px) {
  /* 画面全体が横へはみ出さないようにする */
  body.customer-detail-mode {
    overflow-x: hidden;
  }

  /* 顧客詳細画面を端末の横幅に収める */
  body.customer-detail-mode .app-container {
    width: 100%;
    max-width: none;
    padding: 12px;
  }

  /* グリッド内の内容が親要素を押し広げないようにする */
  #customer-detail-view,
  .customer-detail-shell,
  .customer-detail-panel,
  .customer-detail-section-card {
    width: 100%;
    min-width: 0;
  }

  /* 顧客詳細画面内の間隔 */
  .customer-detail-shell {
    gap: 10px;
  }

  /* 上部プロフィールカード */
  .customer-detail-hero-card {
    grid-template-columns:
      112px minmax(0, 1fr);
    gap: 12px;

    width: 100%;
    min-width: 0;
    padding: 14px;
  }

  /* 顧客写真 */
  .customer-detail-main-photo {
    width: 112px;
    height: 122px;
  }

  /* 顧客写真内の頭文字 */
  .customer-detail-main-photo-initial {
    font-size: 38px;
  }

  /* 名前周辺が画面を押し広げないようにする */
  .customer-detail-hero-information,
  .customer-detail-name-row {
    min-width: 0;
  }

  /* 顧客名と編集ボタン */
  .customer-detail-name-row {
    align-items: flex-start;
    gap: 8px;
  }

  /* 顧客名 */
  .customer-detail-name-row h2 {
    min-width: 0;

    font-size: 23px;

    overflow-wrap: anywhere;
  }

  /* 上部の編集ボタン */
  .customer-detail-edit-button {
    flex-shrink: 0;

    padding: 7px 9px;
  }

  /* スマホでは編集ボタンをアイコンだけにする */
  .customer-detail-edit-button span {
    display: none;
  }

  /* 3つのタブ */
  .customer-detail-tabs {
    top: 4px;

    width: 100%;
    min-width: 0;
  }

  /* タブの文字サイズ */
  .customer-detail-tab-button {
    min-width: 0;
    padding-right: 5px;
    padding-left: 5px;

    font-size: 13px;
  }

  /* 各情報カード */
  .customer-detail-section-card {
    padding: 14px;

    overflow: hidden;
  }

  /* カードタイトル部分 */
  .customer-detail-section-header {
    min-width: 0;
    gap: 10px;
  }

  /* カードタイトル */
  .customer-detail-section-header h3 {
    min-width: 0;
  }

  /* 小さな編集ボタン */
  .customer-detail-section-edit {
    flex-shrink: 0;

    padding-right: 11px;
    padding-left: 11px;
  }

  /* 基本情報 */
  .customer-detail-basic-list > div {
    grid-template-columns:
      110px minmax(0, 1fr);
    gap: 12px;
  }

  /* 基本情報の内容 */
  .customer-detail-basic-list dd {
    min-width: 0;

    overflow-wrap: anywhere;
  }

  /* 来店サマリー */
  .customer-detail-summary-grid {
    min-width: 0;
  }

  /* サマリー1項目 */
  .customer-detail-summary-grid > div {
    min-width: 0;
    min-height: 100px;
    padding-right: 8px;
    padding-left: 8px;
  }

  /* サマリーの数値 */
  .customer-detail-summary-grid dd {
    min-width: 0;

    font-size: 18px;

    overflow-wrap: anywhere;
  }

  /* 写真一覧だけはカード内で横スクロールできるようにする */
  .customer-detail-gallery-list {
    width: 100%;
    max-width: 100%;
    min-width: 0;

    overflow-x: auto;
    overflow-y: hidden;

    overscroll-behavior-inline: contain;
  }

  /* スマホでは写真を少し小さくする */
  .customer-detail-gallery-item {
    flex: 0 0 104px;

    width: 104px;
    height: 104px;
  }

  /* 下部の2ボタン */
  .customer-detail-bottom-actions {
    grid-template-columns:
      minmax(0, 0.85fr)
      minmax(0, 1.15fr);
    gap: 8px;

    width: 100%;
    min-width: 0;
    padding: 8px;
  }

  /* 下部ボタンを割り当てられた幅に収める */
  .customer-detail-bottom-edit,
  .customer-detail-register-button {
    width: 100%;
    min-width: 0;
    padding: 9px 6px;

    font-size: clamp(10px, 2.8vw, 12px);
    white-space: nowrap;
  }

  /* 下部ボタンのアイコン */
  .customer-detail-bottom-edit svg,
  .customer-detail-register-button svg {
    width: 16px;
    height: 16px;

    flex-shrink: 0;
  }

  /* タイムライン */
  .customer-detail-timeline-item {
    grid-template-columns:
      66px minmax(0, 1fr);
    gap: 12px;

    min-width: 0;
  }

  /* タイムラインの日付 */
  .customer-detail-timeline-date {
    padding-right: 11px;
  }

  /* タイムラインカード */
  .customer-detail-timeline-card {
    min-width: 0;
  }

  /* タイムラインカード上部 */
  .customer-detail-timeline-card-header {
    gap: 7px;
  }

  /* 会計金額 */
  .customer-detail-timeline-card-header strong {
    width: 100%;
  }

  /* 来店メモ */
  .customer-detail-timeline-memo {
    overflow-wrap: anywhere;
  }

  /* 売上画面は縦1列にする */
  .customer-detail-sales-grid {
    grid-template-columns:
      minmax(0, 1fr);
  }

  /* 売上グラフ */
  .customer-detail-sales-chart {
    width: 100%;
    min-width: 0;
    gap: 4px;
  }

  /* グラフ上の金額 */
  .customer-detail-sales-bar-item small {
    font-size: 7px;
    white-space: nowrap;
  }

  /* 売上の棒 */
  .customer-detail-sales-bar {
    right: 12%;
    left: 12%;
  }

  /* 編集画面をスマホでは下から表示する */
  .customer-detail-edit-dialog {
    align-items: end;

    padding: 0;
  }

  /* 編集画面本体 */
  .customer-detail-edit-content {
    width: 100%;
    max-height: 90dvh;

    border-radius: 20px 20px 0 0;
  }
}

@media (max-width: 430px) {
  .customer-detail-hero-card {
    grid-template-columns:
      105px minmax(0, 1fr);
    gap: 12px;
  }

  .customer-detail-main-photo {
    width: 105px;
    height: 118px;
  }

  .customer-detail-name-row h2 {
    font-size: 21px;
  }

  .customer-detail-id {
    font-size: 13px;
  }

  .customer-detail-last-visit {
    gap: 5px;

    font-size: 11px;
  }

  .customer-detail-last-visit strong {
    font-size: 13px;
  }

  .customer-detail-basic-list > div {
    grid-template-columns:
      minmax(0, 1fr);
    gap: 5px;
  }

  .customer-detail-bottom-edit,
  .customer-detail-register-button {
    padding: 9px 8px;

    font-size: 11px;
  }
}


/* ==================================================
   15. サマリー画面
   売上・来店状況・来店なし顧客
================================================== */

/* サマリー画面全体 */
.summary-screen {
  display: grid;
  gap: 20px;

  padding: 24px 0 36px;
}

/* 月と集計期間を選択する領域 */
.summary-control-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

/* 月選択 */
.summary-month-picker {
  position: relative;

  display: flex;
  align-items: center;
  gap: 10px;

  min-height: 52px;
  padding: 8px 12px;

  background-color: #fffdf9;
  border: 1px solid rgb(129 134 133 / 16%);
  border-radius: 14px;

  box-shadow:
    0 5px 16px rgb(81 82 84 / 5%);
}

/* 月選択のカレンダー */
.summary-month-picker svg {
  width: 22px;
  height: 22px;

  color: #515254;
}

/* 選択中の月を表示するボタン */
.summary-month-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;

  min-width: 155px;
  min-height: 36px;
  padding: 5px 4px;

  background-color: transparent;
  border: none;
  border-radius: 9px;

  color: #515254;
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  text-align: left;

  cursor: pointer;
}

/* キーボード操作時の選択表示 */
.summary-month-button:focus {
  outline: none;
}

/* 黒い枠ではなくセージ色で表示する */
.summary-month-button:focus-visible {
  outline: 2px solid #7d9680;
  outline-offset: 2px;

  background-color: rgb(227 232 228 / 45%);
}

/* 月選択の下向き矢印 */
.summary-month-chevron {
  width: 18px !important;
  height: 18px !important;

  color: #607862;

  transition:
    transform 0.2s ease;
}

/* 開いているときは矢印を上向きにする */
.summary-month-button[aria-expanded="true"] .summary-month-chevron {
  transform: rotate(180deg);
}

/* 月の選択肢パネル */
.summary-month-options {
  position: absolute;
  top: calc(100% + 8px);
  right: 10px;
  left: 44px;
  z-index: 100;

  display: grid;
  gap: 4px;

  padding: 7px;

  background-color: #fffdf9;
  border: 1px solid rgb(129 134 133 / 18%);
  border-radius: 12px;

  box-shadow:
    0 14px 34px rgb(81 82 84 / 15%);
}

/* 閉じている月選択 */
.summary-month-options[hidden] {
  display: none;
}

/* 月の選択肢 */
.summary-month-option {
  width: 100%;
  min-height: 39px;
  padding: 8px 12px;

  background-color: transparent;
  border: none;
  border-radius: 8px;

  color: #515254;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  text-align: left;

  cursor: pointer;
}

/* 選択肢へマウスを乗せたとき */
.summary-month-option:hover,
.summary-month-option:focus-visible {
  background-color: #f1e8dc;

  outline: none;
}

/* 現在選択している月 */
.summary-month-option--active {
  background-color: #e3e8e4;

  color: #607862;
}

/* 集計期間ボタン */
.summary-period-buttons {
  display: flex;
  align-items: center;
  gap: 4px;

  min-height: 52px;
  padding: 5px;

  background-color: #fffdf9;
  border: 1px solid rgb(129 134 133 / 16%);
  border-radius: 14px;

  box-shadow:
    0 5px 16px rgb(81 82 84 / 5%);
}

/* 集計期間ボタン */
.summary-period-button {
  min-height: 40px;
  padding: 8px 20px;

  background-color: transparent;
  border: none;
  border-radius: 10px;

  color: #515254;
  font: inherit;
  font-size: 13px;
  font-weight: 700;

  cursor: pointer;
}

/* 選択中の集計期間 */
.summary-period-button--active {
  background-color: #8da38b;

  color: #ffffff;
}

/* 4つの主要な数字 */
.summary-kpi-grid {
  display: grid;
  grid-template-columns:
    repeat(4, minmax(0, 1fr));
  gap: 14px;
}

/* 主要な数字のカード */
.summary-kpi-card {
  display: grid;
  gap: 18px;

  min-width: 0;
  padding: 20px;

  background-color: #fffdf9;
  border: 1px solid rgb(129 134 133 / 16%);
  border-radius: 16px;

  box-shadow:
    0 6px 20px rgb(81 82 84 / 6%);
}

/* カードのタイトル */
.summary-kpi-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* カードのタイトル文字 */
.summary-kpi-title h2 {
  margin: 0;

  color: #454b49;
  font-size: 15px;
}

/* 丸いアイコン */
.summary-kpi-icon {
  display: grid;
  place-items: center;

  width: 43px;
  height: 43px;

  background-color: #91a58e;
  border-radius: 50%;

  color: #ffffff;

  flex-shrink: 0;
}

/* 新規顧客のアイコン */
.summary-kpi-card--new .summary-kpi-icon {
  background-color: #f19a52;
}

/* KPIアイコン */
.summary-kpi-icon svg {
  width: 23px;
  height: 23px;
}

/* KPIの大きな数値 */
.summary-kpi-value {
  color: #242927;
  font-size: clamp(27px, 3vw, 37px);
  font-weight: 700;
  white-space: nowrap;
}

/* 前月との比較 */
.summary-kpi-comparison {
  position: relative;

  display: grid;
  gap: 7px;

  padding: 12px 44px 12px 13px;

  background-color: rgb(227 232 228 / 50%);
  border-radius: 11px;
}

/* 新規顧客の比較欄 */
.summary-kpi-card--new .summary-kpi-comparison {
  background-color: rgb(245 177 135 / 12%);
}

/* 比較1行 */
.summary-kpi-comparison > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
}

/* 比較項目名 */
.summary-kpi-comparison span {
  color: #606563;
  font-size: 10px;
  font-weight: 700;
}

/* 比較数値 */
.summary-kpi-comparison strong {
  color: #454b49;
  font-size: 11px;
}

/* 右肩上がりアイコン */
.summary-kpi-comparison > svg {
  position: absolute;
  right: 13px;
  bottom: 17px;

  width: 24px;
  height: 24px;

  color: #607862;
}

/* 共通の白いパネル */
.summary-panel {
  min-width: 0;
  padding: 20px;

  background-color: #fffdf9;
  border: 1px solid rgb(129 134 133 / 16%);
  border-radius: 16px;

  box-shadow:
    0 6px 20px rgb(81 82 84 / 6%);
}

/* パネル上部 */
.summary-panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;

  margin-bottom: 18px;
}

/* パネルタイトル */
.summary-panel-header h2 {
  margin: 0;

  color: #454b49;
  font-size: 17px;
}

/* パネルの補足 */
.summary-panel-header > span,
.summary-panel-header p {
  margin: 3px 0 0;

  color: #818685;
  font-size: 10px;
}

/* 売上推移と割合 */
.summary-main-grid {
  display: grid;
  grid-template-columns:
    minmax(0, 2.1fr)
    minmax(260px, 0.9fr);
  gap: 16px;
}

/* 売上推移上部 */
.summary-trend-header {
  align-items: center;
}

/* 売上推移タイトルと凡例 */
.summary-trend-header > div:first-child {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 22px;
}

/* グラフの凡例 */
.summary-chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;

  color: #606563;
  font-size: 10px;
}

/* 凡例1件 */
.summary-chart-legend span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

/* 売上の凡例 */
.summary-chart-legend-line {
  width: 22px;

  border-top: 2px solid #718a73;
}

/* 来店回数の凡例 */
.summary-chart-legend-dashed {
  width: 22px;

  border-top: 2px dashed #f19a52;
}

/* 日別・月別 */
.summary-chart-mode-buttons {
  display: flex;
  padding: 3px;

  background-color: #f4f1eb;
  border-radius: 10px;
}

/* 日別・月別ボタン */
.summary-chart-mode-button {
  min-width: 56px;
  min-height: 34px;

  background-color: transparent;
  border: none;
  border-radius: 8px;

  color: #606563;
  font: inherit;
  font-size: 11px;
  font-weight: 700;

  cursor: pointer;
}

/* 選択中のグラフ表示 */
.summary-chart-mode-button--active {
  background-color: #7d9680;

  color: #ffffff;
}

/* グラフ本体 */
.summary-trend-chart {
  width: 100%;

  overflow-x: auto;
  overflow-y: hidden;
}

/* SVGグラフ */
.summary-trend-svg {
  display: block;

  width: 100%;
  min-width: 700px;
  height: auto;
}

/* グラフの補助線 */
.summary-chart-grid-line {
  stroke: rgb(129 134 133 / 16%);
  stroke-width: 1;
}

/* グラフの目盛り */
.summary-chart-axis-label {
  fill: #818685;

  font-size: 10px;
}

/* 売上の線 */
.summary-chart-sales-line {
  fill: none;
  stroke: #718a73;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 来店回数の線 */
.summary-chart-visit-line {
  fill: none;
  stroke: #f19a52;
  stroke-width: 2;
  stroke-dasharray: 6 5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* 売上データの点 */
.summary-chart-sales-point {
  fill: #718a73;
  stroke: #fffdf9;
  stroke-width: 2;
}

/* 来店回数の点 */
.summary-chart-visit-point {
  fill: #f19a52;
  stroke: #fffdf9;
  stroke-width: 2;
}

/* 新規・常連の割合 */
.summary-ratio-card {
  display: grid;
  align-content: start;
}

/* ドーナツグラフ */
.summary-ratio-donut {
  position: relative;

  display: grid;
  place-items: center;

  width: min(220px, 100%);
  aspect-ratio: 1;
  margin: 8px auto 22px;

  background:
    conic-gradient(
      #91a58e 0 var(--regular-percent),
      #f5b187 var(--regular-percent) 100%
    );
  border-radius: 50%;
}

/* ドーナツの中央 */
.summary-ratio-donut::after {
  content: "";

  position: absolute;
  inset: 28%;

  background-color: #fffdf9;
  border-radius: 50%;
}

/* ドーナツ中央の数字 */
.summary-ratio-donut-center {
  position: relative;
  z-index: 1;

  display: grid;
  grid-template-columns:
    auto auto;
  align-items: end;
  justify-content: center;
  gap: 3px;

  text-align: center;
}

/* 来店回数 */
.summary-ratio-donut-center strong {
  color: #242927;
  font-size: 31px;
}

/* 回 */
.summary-ratio-donut-center > span {
  padding-bottom: 5px;

  color: #454b49;
  font-size: 13px;
}

/* 中央の説明 */
.summary-ratio-donut-center small {
  grid-column: 1 / -1;

  color: #606563;
  font-size: 9px;
}

/* 割合の凡例 */
.summary-ratio-legend {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 12px;
}

/* 割合の凡例1件 */
.summary-ratio-legend > div {
  display: grid;
  grid-template-columns:
    auto 1fr;
  align-items: center;
  gap: 4px 7px;
}

/* 凡例の丸 */
.summary-ratio-dot {
  width: 12px;
  height: 12px;

  border-radius: 50%;
}

/* 常連の丸 */
.summary-ratio-dot--regular {
  background-color: #91a58e;
}

/* 新規の丸 */
.summary-ratio-dot--new {
  background-color: #f5b187;
}

/* 凡例の文字 */
.summary-ratio-legend span {
  color: #515254;
  font-size: 12px;
}

/* 凡例の回数 */
.summary-ratio-legend strong {
  color: #454b49;
  font-size: 12px;
  text-align: right;
}

/* 凡例の割合 */
.summary-ratio-legend small {
  grid-column: 2;

  color: #818685;
  font-size: 10px;
  text-align: right;
}

/* 下部のカード配置 */
.summary-sub-grid {
  display: grid;
  grid-template-columns:
    minmax(0, 1.2fr)
    minmax(230px, 0.72fr)
    minmax(0, 1fr);
  gap: 16px;
}

/* 来店なし顧客を縦に大きく表示する */
.summary-no-visit-card {
  grid-row: span 2;
}

/* 来店なし顧客の人数 */
.summary-no-visit-card .summary-panel-header > strong {
  color: #607862;
  font-size: 18px;
}

/* 来店なし期間フィルター */
.summary-no-visit-filters {
  display: grid;
  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  margin-bottom: 10px;

  border: 1px solid rgb(129 134 133 / 16%);
  border-radius: 10px;

  overflow: hidden;
}

/* 来店なし期間ボタン */
.summary-no-visit-filter {
  min-height: 36px;

  background-color: transparent;
  border: none;
  border-right:
    1px solid rgb(129 134 133 / 16%);

  color: #606563;
  font: inherit;
  font-size: 11px;
  font-weight: 700;

  cursor: pointer;
}

/* 最後の期間ボタン */
.summary-no-visit-filter:last-child {
  border-right: none;
}

/* 選択中の期間 */
.summary-no-visit-filter--active {
  background-color: #7d9680;

  color: #ffffff;
}

/* 来店なし顧客一覧 */
.summary-no-visit-list {
  display: grid;
}

/* 来店なし顧客1件 */
.summary-no-visit-item {
  display: grid;
  grid-template-columns:
    45px minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;

  padding: 13px 2px;

  border-bottom:
    1px solid rgb(129 134 133 / 13%);
}

/* 顧客の頭文字 */
.summary-no-visit-avatar {
  display: grid;
  place-items: center;

  width: 45px;
  height: 45px;

  background-color: #e3e8e4;
  border-radius: 12px;

  color: #607862;
  font-size: 17px;
  font-weight: 700;
}

/* 顧客情報 */
.summary-no-visit-information {
  display: grid;
  gap: 4px;

  min-width: 0;
}

/* 顧客名 */
.summary-no-visit-information strong {
  color: #454b49;
  font-size: 13px;
}

/* 最終来店と担当 */
.summary-no-visit-information span {
  color: #818685;
  font-size: 9px;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 顧客詳細を見る */
.summary-no-visit-detail {
  min-height: 31px;
  padding: 5px 9px;

  background-color: transparent;
  border: 1px solid #c9bdaf;
  border-radius: 8px;

  color: #607862;
  font: inherit;
  font-size: 9px;
  font-weight: 700;

  cursor: pointer;
}

/* 対象者がいない場合 */
.summary-no-visit-empty {
  margin: 20px 0;
  padding: 20px;

  background-color: #f6f3ed;
  border-radius: 10px;

  color: #818685;
  font-size: 12px;
  text-align: center;
}

/* 一覧をすべて表示する */
.summary-list-more-button,
.summary-card-link-button {
  display: flex;
  align-items: center;
  justify-content: space-between;

  width: 100%;
  min-height: 40px;
  margin-top: 12px;
  padding: 8px 14px;

  background-color: transparent;
  border: 1px solid #d6cabd;
  border-radius: 9px;

  color: #515254;
  font: inherit;
  font-size: 11px;
  font-weight: 700;

  cursor: pointer;
}

/* 非表示状態の「すべて表示」ボタンは確実に隠す */
.summary-list-more-button[hidden] {
  display: none;
}

/* 今月の誕生日カード */
.summary-birthday-card {
  display: grid;
  align-content: start;
}

/* 誕生日アイコン */
.summary-birthday-card .summary-panel-header svg {
  width: 23px;
  height: 23px;

  color: #f19a52;
}

/* 誕生日の合計 */
.summary-birthday-total {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 4px;

  margin: 5px 0 16px;
}

/* 誕生日人数 */
.summary-birthday-total strong {
  color: #242927;
  font-size: 39px;
}

/* 名 */
.summary-birthday-total span {
  color: #454b49;
  font-size: 18px;
}

/* 今週と来週 */
.summary-birthday-breakdown {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0, 1fr));
  gap: 9px;
}

/* 誕生日内訳 */
.summary-birthday-breakdown > div {
  display: grid;
  gap: 6px;

  padding: 12px;

  background-color: rgb(245 177 135 / 10%);
  border-radius: 10px;

  text-align: center;
}

/* 今週・来週 */
.summary-birthday-breakdown span {
  color: #606563;
  font-size: 10px;
}

/* 誕生日人数 */
.summary-birthday-breakdown strong {
  color: #454b49;
  font-size: 18px;
}

/* 誕生日カードの顧客検索ボタン */
.summary-card-link-button {
  transition:
    background-color 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease,
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

/* 顧客検索ボタンへマウスを乗せたとき */
.summary-card-link-button:hover {
  background-color: #e3e8e4;
  border-color: #7d9680;

  color: #607862;

  transform: translateY(-1px);

  box-shadow:
    0 5px 14px rgb(81 82 84 / 8%);
}

/* 右側の矢印を少し動かす */
.summary-card-link-button span:last-child {
  transition:
    transform 0.2s ease;
}

.summary-card-link-button:hover span:last-child {
  transform: translateX(3px);
}

/* キーボード操作時も選択位置を表示する */
.summary-card-link-button:focus-visible {
  outline: 2px solid #7d9680;
  outline-offset: 3px;
}

/* 曜日一覧 */
.summary-weekday-list {
  display: grid;
  gap: 10px;
}

/* 曜日1件 */
.summary-weekday-item {
  display: grid;
  grid-template-columns:
    22px minmax(0, 1fr) 35px;
  align-items: center;
  gap: 9px;
}

/* 曜日と回数 */
.summary-weekday-item span,
.summary-weekday-item strong {
  color: #515254;
  font-size: 10px;
}

/* 曜日バー背景 */
.summary-weekday-track {
  height: 8px;

  background-color: #ece8e1;
  border-radius: 999px;

  overflow: hidden;
}

/* 曜日バー */
.summary-weekday-bar {
  width: var(--weekday-width);
  height: 100%;

  background-color: #91a58e;
  border-radius: inherit;
}

/* 最も多い曜日 */
.summary-weekday-item--highest .summary-weekday-bar {
  background-color: #f19a52;
}

/* 最も多い曜日の文字 */
.summary-weekday-item--highest strong {
  color: #f19a52;
}

/* AI分析カード */
.summary-ai-card {
  grid-column: 2 / 4;
}

/* Geminiラベル */
.summary-ai-label {
  padding: 7px 12px;

  background-color: #f1f2ec;
  border-radius: 999px;

  color: #454b49;
  font-size: 11px;
}

/* AI分析一覧 */
.summary-ai-list {
  display: grid;
  gap: 12px;
}

/* AI分析1件 */
.summary-ai-item {
  display: grid;
  grid-template-columns:
    39px minmax(0, 1fr);
  gap: 11px;
}

/* AI分析アイコン */
.summary-ai-item-icon {
  display: grid;
  place-items: center;

  width: 39px;
  height: 39px;

  background-color: #eef1e9;
  border-radius: 10px;

  color: #607862;
}

/* 注意情報のアイコン */
.summary-ai-item--warning .summary-ai-item-icon {
  background-color: rgb(245 177 135 / 13%);

  color: #f19a52;
}

/* AI分析のアイコン */
.summary-ai-item-icon svg {
  width: 22px;
  height: 22px;
}

/* AI分析本文 */
.summary-ai-item-content {
  display: grid;
  gap: 3px;
}

/* AI分析タイトル */
.summary-ai-item-content strong {
  color: #454b49;
  font-size: 12px;
}

/* AI分析説明 */
.summary-ai-item-content span {
  color: #818685;
  font-size: 10px;
  line-height: 1.6;
}

/* 更新時刻の注意書き */
.summary-update-note {
  display: flex;
  align-items: center;
  gap: 8px;

  margin: 14px 0 0;

  color: #818685;
  font-size: 10px;
}

/* 注意書きアイコン */
.summary-update-note svg {
  width: 17px;
  height: 17px;
}

/* タブレット表示 */
@media (max-width: 950px) {
  .summary-control-bar {
    align-items: stretch;
    flex-direction: column;
  }

  .summary-period-buttons {
    display: grid;
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
  }

  .summary-period-button {
    justify-content: center;

    padding-right: 8px;
    padding-left: 8px;
  }

  .summary-kpi-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .summary-main-grid {
    grid-template-columns:
      minmax(0, 1fr);
  }

  .summary-ratio-donut {
    width: 210px;
  }

  .summary-sub-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .summary-no-visit-card {
    grid-column: 1 / -1;
    grid-row: auto;
  }

  .summary-ai-card {
    grid-column: 1 / -1;
  }
}

/* スマホ表示 */
@media (max-width: 650px) {
  .summary-screen {
    gap: 13px;

    padding-top: 16px;
  }

  .summary-month-picker {
    width: 100%;
  }

  .summary-month-button {
    width: 100%;
  }

  .summary-period-buttons {
    display: flex;

    overflow-x: auto;
  }

  .summary-period-button {
    flex: 0 0 auto;
  }

  .summary-kpi-grid {
    grid-template-columns:
      minmax(0, 1fr);
    gap: 10px;
  }

  .summary-kpi-card {
    grid-template-columns:
      minmax(0, 1fr) auto;
    gap: 12px;
  }

  .summary-kpi-title {
    grid-column: 1;
  }

  .summary-kpi-value {
    grid-column: 1;

    font-size: 30px;
  }

  .summary-kpi-comparison {
    grid-column: 2;
    grid-row: 1 / 3;

    min-width: 145px;
  }

  .summary-sub-grid {
    grid-template-columns:
      minmax(0, 1fr);
  }

  .summary-no-visit-card,
  .summary-ai-card {
    grid-column: auto;
  }

  .summary-trend-header {
    align-items: flex-start;
    flex-direction: column;
  }

  .summary-no-visit-item {
    grid-template-columns:
      42px minmax(0, 1fr);
  }

  .summary-no-visit-detail {
    grid-column: 2;

    justify-self: start;
  }
}

/* 小さなスマートフォン */
@media (max-width: 430px) {
  .summary-kpi-card {
    grid-template-columns:
      minmax(0, 1fr);
  }

  .summary-kpi-comparison {
    grid-column: 1;
    grid-row: auto;

    min-width: 0;
  }

  .summary-panel {
    padding: 15px;
  }

  .summary-ratio-legend {
    grid-template-columns:
      minmax(0, 1fr);
  }

  .summary-no-visit-item {
    grid-template-columns:
      39px minmax(0, 1fr);
  }
}


/* ==================================================
   16. レスポンシブ設定
   画面幅に応じてレイアウトを切り替える
================================================== */

/* 横幅が600px以下の小さなスマートフォン向け設定 */
@media (max-width: 600px) {
  .brand-logo {
    width: 44px;
    height: 44px;
    border-width: 8px;
  }

  .brand-text h1 {
    font-size: 22px;
  }

  .brand-text p {
    font-size: 11px;
  }

  /* スマホではボタンの文字を隠し、アイコンだけ表示する */
  .action-label {
    display: none;
  }

  /* スマホではメニューパネルを少しコンパクトにする */
  .menu-panel {
    overflow-y: auto;
  }

  .menu-item-text {
    gap: 2px;
  }

  /* 内容の高さに合わせてメニュー全体を伸ばす */
  .menu-panel-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 32dvh auto;

    width: 100%;
    height: auto;
    min-height: 100dvh;
  }

  /* スマホでは画像エリアを上部に配置する */
  .menu-panel-visual {
    width: 100%;
    min-width: 0;
    height: 32dvh;
    min-height: 0;
  }

  /* 画像上の文字をスマホ向けに調整する */
  .menu-panel-visual-placeholder {
    justify-content: flex-end;
    gap: 8px;

    padding: 20px;

    /* デスク周辺が見えやすい位置に調整する */
    background-position: center 42%;
  }

  /* 英字ラベルを少し小さくする */
  .menu-panel-visual-label {
    font-size: 10px;
    letter-spacing: 0.18em;
  }

  /* 日本語メッセージをスマホ向けの大きさにする */
  .menu-panel-visual-text {
    max-width: 300px;
    font-size: 24px;
    line-height: 1.4;
  }

  /* メニュー部分だけに付いていたスクロールを解除する */
  .menu-panel-content {
    width: 100%;
    min-width: 0;
    height: auto;

    overflow-y: visible;
  }

  /* タイトルとcloseボタン周辺 */
  .menu-panel-top {
    gap: 16px;
    padding-bottom: 14px;
  }

  /* スマホではタイトルを少し小さくする */
  .menu-panel-title {
    font-size: 28px;
  }

  /* closeボタンをコンパクトにする */
  .menu-close-button {
    gap: 7px;
    padding: 8px 14px;
    font-size: 12px;
  }

  /* メニュー一覧を上から自然に並べる */
  .menu-list {
    align-self: start;

    max-width: none;
    margin: 12px 0 0;
  }

  /* 各メニュー項目の縦幅を少し抑える */
  .menu-item {
    gap: 12px;
    padding: 13px 4px;
  }

  /* メニュー名 */
  .menu-item-title {
    font-size: 16px;
  }

  /* 補足説明 */
  .menu-item-description {
    font-size: 12px;
    line-height: 1.5;
  }

    /* 来店登録画面のスマホ表示 */
  #visit-registration-view {
    padding: 28px 0 20px;
  }

  /* 2枚のカード間隔 */
  .visit-registration-options {
    gap: 16px;
  }

  /* 選択カードをスマホ幅へ合わせる */
  .visit-registration-card {
    grid-template-columns:
      66px
      1px
      minmax(0, 1fr);
    gap: 16px;

    min-height: 150px;
    padding:
      22px
      48px
      22px
      18px;

    border-radius: 24px;
  }

  /* スマホではアイコンを小さくする */
  .visit-registration-card-icon {
    width: 64px;
    height: 64px;
  }

  .visit-registration-card-icon svg {
    width: 38px;
    height: 38px;
  }

  /* スマホでは点線を短くする */
  .visit-registration-card-divider {
    height: 70px;
  }

  /* カード内の文字間隔 */
  .visit-registration-card-content {
    gap: 8px;
  }

  /* カードタイトル */
  .visit-registration-card-title {
    font-size: 23px;
  }

  /* カード説明文 */
  .visit-registration-card-description {
    font-size: 12px;
  }

  /* カード右側の矢印 */
  .visit-registration-card-arrow {
    right: 17px;

    font-size: 34px;
  }

  /* 画面下部の装飾 */
  .visit-registration-decoration {
    width: 72%;
    margin-top: 36px;
  }

  .visit-registration-decoration-mark {
    width: 50px;
    height: 50px;
  }

  .visit-registration-decoration-mark::before {
    width: 20px;
    height: 20px;

    border-width: 5px;
  }

    /* 常連顧客更新画面のスマホ表示 */
  #regular-customer-view {
    padding-top: 6px;
  }

  /* 検索結果を縦並びにする */
  .regular-customer-result-item {
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;

    padding: 16px;
  }

  /* 顧客選択ボタンを横幅いっぱいにする */
  .regular-customer-select-button {
    width: 100%;
  }

  /* 選択中顧客カード */
  .regular-selected-customer {
    padding: 20px;
  }

  /* 顧客プロフィールを上から並べる */
  .regular-selected-customer-profile {
    align-items: flex-start;
  }

  /* 顧客アイコン */
  .regular-selected-customer-avatar {
    width: 60px;
    height: 60px;

    font-size: 18px;
  }

  /* 顧客名 */
  .regular-selected-customer-name-row strong {
    font-size: 19px;
  }

  /* 集計情報を2列にする */
  .regular-selected-customer-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px 0;
  }

  /* PC用の左右余白をスマホで調整する */
  .regular-selected-customer-stats > div {
